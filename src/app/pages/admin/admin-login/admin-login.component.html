<div class="admin-login">

  <div class="login-card">

    <img
      class="login-logo"
      src="assets/logo.svg"
      alt="Infini Innovation (PTY) LTD logo"
    />

    <h1>Admin Login</h1>

    <p class="login-subtitle">
      Sign in to access the seminar submissions.
    </p>


    <form
      #loginForm="ngForm"
      (ngSubmit)="login()"
      class="login-form">


      <!-- USERNAME -->

      <div class="form-field">

        <label for="username">Username</label>

        <input
          id="username"
          type="text"
          name="username"
          placeholder="Enter your username"
          autocomplete="username"
          [(ngModel)]="credentials.username"
          required
        />

      </div>


      <!-- PASSWORD -->

      <div class="form-field">

        <label for="password">Password</label>

        <input
          id="password"
          type="password"
          name="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          [(ngModel)]="credentials.password"
          required
        />

      </div>


      <!-- ERROR -->

      <div
        *ngIf="errorMessage"
        class="alert alert-error">

        <span class="alert-icon">!</span>

        <p>{{ errorMessage }}</p>

      </div>


      <!-- LOGIN -->

      <button
        type="submit"
        class="btn-login"
        [disabled]="loginForm.invalid || isLoggingIn">

        {{
          isLoggingIn
            ? 'Logging in...'
            : 'Login'
        }}

      </button>


    </form>

  </div>

</div>
